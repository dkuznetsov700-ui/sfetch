[project]
name = "sfetch"
version = "0.1.0"
description = "A minimal, customizable system info fetcher written in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "YOUR NAME", email = "you@example.com"},
]
keywords = ["fetch", "system-info", "cli", "neofetch", "fastfetch"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/YOUR_NICK/sfetch"
Repository = "https://github.com/YOUR_NICK/sfetch"
Issues = "https://github.com/YOUR_NICK/sfetch/issues"

[project.scripts]
sfetch = "sfetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
